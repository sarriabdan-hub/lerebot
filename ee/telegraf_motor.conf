# Telegraf config: motor telemetry -> InfluxDB -> Grafana
#
# The vla_server safety watchdog appends one JSON line every ~0.5s during executes to
# /tmp/motor_telemetry.jsonl on THOR, e.g.:
#   {"ts": 1751400000.1, "temp.shoulder_pan": 38, ..., "ma.shoulder_lift": 412.5, ...}
#
# SETUP (run Telegraf ON THOR, point it at InfluxDB on the WS or on Thor itself):
#   1. Thor:  sudo apt install telegraf          (or download the .deb from influxdata)
#   2. WS (or Thor): run InfluxDB v2 + Grafana, e.g. with docker:
#        docker run -d -p 8086:8086 --name influx influxdb:2
#        docker run -d -p 3000:3000 --name grafana grafana/grafana
#      In Influx UI (http://<host>:8086): create org "lab", bucket "motors", an API token.
#   3. Fill the token/urls below, then:
#        telegraf --config /home/robot/dev/lerebot/ee/telegraf_motor.conf
#   4. Grafana (http://<host>:3000): add InfluxDB datasource (Flux, same token),
#      dashboard panels:  filter(fn: (r) => r._measurement == "motors")
#      -> per-joint temp lines + per-joint current lines. Alert rule at 50C / 1200mA
#      gives you an early warning BEFORE the watchdog trips at 55C/1400mA.

[agent]
  interval = "1s"
  flush_interval = "2s"

[[inputs.tail]]
  files = ["/tmp/motor_telemetry.jsonl"]
  from_beginning = false
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix"
  name_override = "motors"

[[outputs.influxdb_v2]]
  urls = ["http://192.168.123.170:8086"]   # InfluxDB host (WS). Change if running on Thor.
  token = "PASTE_INFLUX_TOKEN_HERE"
  organization = "lab"
  bucket = "motors"
